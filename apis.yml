name: Orolabs
description: >-
  ORO Labs provides an agentic procurement orchestration platform for enterprise
  spend management. It coordinates people, processes, systems, and data so employees
  can get what they need without friction, unifying intake management, supplier
  onboarding and lifecycle, risk and compliance orchestration, and AI-driven workflow
  automation. The platform offers a no-code workflow builder, a purpose-built agent
  builder for custom procurement AI agents, and bring-your-own-LLM flexibility, with
  secure, semantically rich integrations across the procuretech landscape. ORO Labs
  is backed by Felicis and Norwest Venture Partners.
